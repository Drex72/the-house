name: Game tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game JavaScript syntax
        run: |
          for file in public/js/*.js server/*.mjs; do node --check "$file"; done
      - name: Unit and simulation tests
        run: npm test
      - name: Three-client multiplayer smoke test
        run: npm run test:integration
